; Rendered by sippycup-practice-entrypoint. Everything writable lives in the
; container's tmpfs; the image root filesystem is mounted read-only.
[directories]
astetcdir => @RUNTIME@/etc
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => @RUNTIME@/db
astkeydir => @RUNTIME@/db
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => @RUNTIME@/spool
astrundir => @RUNTIME@/run
astlogdir => @RUNTIME@/log
astsbindir => /usr/sbin

[options]
; Practice target: bounded, quiet, and never a public service.
verbose = 0
debug = 0
maxcalls = 4
maxload = 0
documentation_language = en_US
hideconnect = yes
transmit_silence = no
; No interface exists to seed the entity ID from; use a fixed local value.
entityid = 02:00:00:00:00:01
