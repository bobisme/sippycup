; Sippycup practice destinations. Every destination is reached only after
; Digest authentication of the practice account.
[general]
static = yes
writeprotect = yes
autofallthrough = yes

[practice]
; Echo every received audio frame back to the caller.
exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => 600,1,Goto(echo,1)

; Play the deterministic Sippycup canary (media/canary-v1
; callee_to_caller.pcmu or .pcma) three times, then hang up.
exten => tone,1,Answer()
 same => n,Playback(sippycup/canary&sippycup/canary&sippycup/canary)
 same => n,Hangup()
exten => 601,1,Goto(tone,1)

; Reject before answer: 486 Busy Here.
exten => busy,1,Hangup(17)
exten => 486,1,Goto(busy,1)

; Reject before answer: 603 Decline.
exten => decline,1,PJSIPHangup(603)
exten => 603,1,Goto(decline,1)

; Any other user part gets 404 Not Found from chan_pjsip.

; ---- DTMF echo (softphone gate, bn-19a) ----
; Answer and, under a continuous 425 Hz tone (so media has no gaps), collect
; up to 32 RFC 4733 digits (no terminator, so * and # are digits too; 4 s
; inter-digit timeout). Then send exactly the digits received back to the
; caller as RFC 4733 events and keep the tone until the caller hangs up (at
; most 10 minutes). The caller's own capture shows both digit sequences, so
; receipt is proven without any target-side log.
exten => dtmf,1,Answer()
 same => n,Playtones(425)
 same => n,Read(digits,,32,t(),1,4)
 same => n,GotoIf($["${digits}" = ""]?done)
 same => n,SendDTMF(${digits})
 same => n(done),Wait(600)
 same => n,Hangup()
exten => 602,1,Goto(dtmf,1)
; ---- end DTMF echo ----
