; Sippycup practice destinations. Every destination is reached only after
; Digest authentication of the practice account.
[general]
static = yes
writeprotect = yes
autofallthrough = yes

[practice]
; Echo every received audio frame back to the caller.
exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => 600,1,Goto(echo,1)

; Play the deterministic Sippycup canary (media/canary-v1
; callee_to_caller.pcmu or .pcma) three times, then hang up.
exten => tone,1,Answer()
 same => n,Playback(sippycup/canary&sippycup/canary&sippycup/canary)
 same => n,Hangup()
exten => 601,1,Goto(tone,1)

; Reject before answer: 486 Busy Here.
exten => busy,1,Hangup(17)
exten => 486,1,Goto(busy,1)

; Reject before answer: 603 Decline.
exten => decline,1,PJSIPHangup(603)
exten => 603,1,Goto(decline,1)

; Any other user part gets 404 Not Found from chan_pjsip.

; ==== BEGIN fault destinations (bn-20l): practice destinations that misbehave on purpose ====
; Ring (180) and never answer. The caller's answer timeout fires and its
; CANCEL ends the channel; the long Wait is only a backstop.
exten => noanswer,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()

; Ring for 12 s, then answer and echo: both sides of --answer-timeout.
exten => late,1,Ringing()
 same => n,Wait(12)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Answer and then send no RTP at all. Wait() generates no frames, so
; Asterisk writes nothing to the RTP socket while it still receives.
exten => silent,1,Answer()
 same => n,Wait(60)
 same => n,Hangup()

; Answer and send RTP that is digital silence (0xFF u-law / 0xD5 A-law).
exten => silence,1,Answer()
 same => n,Playback(sippycup/silence)
 same => n,Hangup()

; Answer, echo for 3 s, then hang up from the server side (BYE from the peer).
exten => drop,1,Answer()
 same => n,Set(TIMEOUT(absolute)=3)
 same => n,Echo()
 same => n,Hangup()

; Reject before answer with 503, 403 and 429.
exten => unavailable,1,PJSIPHangup(503)
exten => forbidden,1,PJSIPHangup(403)
exten => ratelimit,1,PJSIPHangup(429)

; 183 Session Progress with 3 s of early media, then answer and echo.
exten => earlymedia,1,Progress()
 same => n,Playback(sippycup/canary&sippycup/canary&sippycup/canary,noanswer)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
; ==== END fault destinations (bn-20l) ====
