; Sippycup practice destinations. Every destination is reached only after
; Digest authentication of the practice account.
[general]
static = yes
writeprotect = yes
autofallthrough = yes

[practice]
; Echo every received audio frame back to the caller.
exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => 600,1,Goto(echo,1)

; Play the deterministic Sippycup canary (media/canary-v1
; callee_to_caller.pcmu or .pcma) three times, then hang up.
exten => tone,1,Answer()
 same => n,Playback(sippycup/canary&sippycup/canary&sippycup/canary)
 same => n,Hangup()
exten => 601,1,Goto(tone,1)

; Reject before answer: 486 Busy Here.
exten => busy,1,Hangup(17)
exten => 486,1,Goto(busy,1)

; Reject before answer: 603 Decline.
exten => decline,1,PJSIPHangup(603)
exten => 603,1,Goto(decline,1)

; Any other user part gets 404 Not Found from chan_pjsip.
