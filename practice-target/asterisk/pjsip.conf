; Sippycup local practice target. Rendered at container start; the password
; placeholder is substituted from /practice/account.password and the rendered
; file exists only in the container's tmpfs.

[global]
type = global
; A request is matched to the practice account by its From user first, then by
; its loopback source address. Either way the endpoint demands Digest
; authentication, so every unauthenticated INVITE or REGISTER is challenged
; with 401. OPTIONS alone is answered without credentials (see the endpoint).
; The header identifier comes first only for the practice proxy's trunk token
; (bn-2g0, see "proxy trunk" below); a request without that token is
; identified exactly as before.
endpoint_identifier_order = header,username,ip
user_agent = Sippycup practice target (Asterisk)
default_realm = @DNS_NAME@
max_forwards = 10
keep_alive_interval = 0
unidentified_request_count = 5
unidentified_request_period = 5

[transport-udp]
type = transport
protocol = udp
bind = @ADDRESS@:5060

[transport-tcp]
type = transport
protocol = tcp
bind = @ADDRESS@:5060

[transport-tls]
type = transport
protocol = tls
bind = @ADDRESS@:5061
cert_file = @RUNTIME@/tls/server.crt
priv_key_file = @RUNTIME@/tls/server.key
method = tlsv1_2
verify_client = no
require_client_cert = no

[@ACCOUNT@]
type = auth
auth_type = digest
username = @ACCOUNT@
password = @PASSWORD@
realm = @DNS_NAME@

[@ACCOUNT@]
type = aor
max_contacts = 1
remove_existing = yes
minimum_expiration = 30
default_expiration = 120
maximum_expiration = 300
qualify_frequency = 0

[@ACCOUNT@]
type = endpoint
context = practice
disallow = all
allow = ulaw,alaw
auth = @ACCOUNT@
aors = @ACCOUNT@
identify_by = username,ip
allow_unauthenticated_options = yes
direct_media = no
rtp_symmetric = yes
; Strict RFC 3261 section 18.2.2 response routing: a UDP response goes to the
; Via sent-by port unless the request carries RFC 3581 rport. Asterisk's
; default (yes) would hide a client that omits rport or its real port.
force_rport = no
rewrite_contact = no
media_address = @ADDRESS@
bind_rtp_to_media_address = yes
; SDES-SRTP when the caller offers a=crypto (RTP/SAVP or RTP/AVP), plain RTP
; otherwise.
media_encryption = sdes
media_encryption_optimistic = yes
dtmf_mode = rfc4733
send_pai = no
trust_id_inbound = no
trust_id_outbound = no
allow_subscribe = no
allow_transfer = no
timers = no

[@ACCOUNT@-loopback]
type = identify
endpoint = @ACCOUNT@
match = 127.0.0.0/8

; ==== BEGIN fault endpoint (bn-20l): SRTP required ====
; A second account that demands SDES-SRTP. The guided call offers plain
; RTP/AVP, so every INVITE from this account gets 488 Not Acceptable Here.
; (A codec mismatch cannot be made: PJSUA always offers PCMA, G722, speex,
; iLBC, GSM, and opus besides PCMU, and the image has only the G.711 codecs.)
; Dial any destination as this user, for example echo.
[@ACCOUNT@-srtp]
type = auth
auth_type = digest
username = @ACCOUNT@-srtp
password = @PASSWORD@
realm = @DNS_NAME@

[@ACCOUNT@-srtp]
type = aor
max_contacts = 1
remove_existing = yes
minimum_expiration = 30
default_expiration = 120
maximum_expiration = 300
qualify_frequency = 0

[@ACCOUNT@-srtp]
type = endpoint
context = practice
disallow = all
allow = ulaw,alaw
auth = @ACCOUNT@-srtp
aors = @ACCOUNT@-srtp
identify_by = username
direct_media = no
rtp_symmetric = yes
force_rport = no
rewrite_contact = no
media_address = @ADDRESS@
bind_rtp_to_media_address = yes
; Required, not optimistic: an offer without a=crypto is refused.
media_encryption = sdes
media_encryption_optimistic = no
dtmf_mode = rfc4733
send_pai = no
trust_id_inbound = no
trust_id_outbound = no
allow_subscribe = no
allow_transfer = no
timers = no
; ==== END fault endpoint (bn-20l) ====

; ==== BEGIN proxy trunk (bn-2g0) ====
; The practice proxy (Kamailio on @PROXY_ADDRESS@) authenticates the caller
; itself (407, realm @PROXY_REALM@) and forwards the INVITE here. Asterisk must
; trust those forwarded calls without weakening the direct path:
;   - In this single loopback namespace every process can send from any
;     127.x address, so the source address alone proves nothing. The proxy
;     therefore adds X-Sippycup-Trunk with a random token generated at every
;     container start and strips any copy a client sends. The token exists
;     only in the container's tmpfs and on the trunk leg, which is TLS (to
;     transport-tls below), so it never appears in a capture. Only a request
;     carrying that exact token is identified as this endpoint (header
;     identification runs first).
;   - The endpoint ACL additionally refuses the trunk identity from any source
;     other than the proxy address.
;   - Every other request (no token, wrong token) is identified by From user
;     and source address exactly as before and is challenged with 401.
[proxy-trunk]
type = endpoint
context = practice
disallow = all
allow = ulaw,alaw
identify_by = header
deny = 0.0.0.0/0.0.0.0
permit = @PROXY_ADDRESS@/255.255.255.255
direct_media = no
rtp_symmetric = yes
force_rport = no
rewrite_contact = no
media_address = @ADDRESS@
bind_rtp_to_media_address = yes
media_encryption = sdes
media_encryption_optimistic = yes
dtmf_mode = rfc4733
send_pai = no
trust_id_inbound = no
trust_id_outbound = no
allow_subscribe = no
allow_transfer = no
timers = no

[proxy-trunk]
type = identify
endpoint = proxy-trunk
match_header = X-Sippycup-Trunk: @TRUNK_TOKEN@
; ==== END proxy trunk (bn-2g0) ====
