#!KAMAILIO
#
# Sippycup practice proxy (bn-2g0). Rendered at container start into the
# container's tmpfs; the placeholders are substituted by the entrypoint and the
# rendered file is never written to the image or the operator's work/.
#
# A second, differently shaped SIP stack in front of the practice Asterisk,
# modeled on a commercial proxy/SBC edge:
#   - its own loopback address (@PROXY_ADDRESS@), UDP/TCP 5060 and TLS 5061;
#   - REGISTER is answered here (in-memory registrar) after a 401 challenge,
#     INVITE is challenged with 407 Proxy-Authenticate, realm @PROXY_REALM@;
#   - every forwarded INVITE is Record-Routed (two Route entries when the
#     transport changes) and in-dialog requests must follow the route set:
#     an in-dialog request without this proxy's Route is refused with 404;
#   - calls are forwarded over TLS to the practice Asterisk on @ADDRESS@ (the
#     trunk leg carries the trunk token, so it is never readable in a
#     capture; the proxy verifies Asterisk's certificate against the
#     per-`up` CA), so
#     the media address in the SDP answer (@ADDRESS@) differs from the
#     signaling address the caller talks to (@PROXY_ADDRESS@);
#   - OPTIONS outside a dialog is answered here with 200 OK;
#   - a request flood from one source is refused with 503 (pike).

#!substdef "!PRACTICE_ACCOUNT!@ACCOUNT@!g"
#!substdef "!PRACTICE_PASSWORD!@PASSWORD@!g"
#!substdef "!PROXY_REALM!@PROXY_REALM@!g"
#!substdef "!TRUNK_TOKEN!@TRUNK_TOKEN@!g"
#!substdef "!ASTERISK_HOP!sip:@ADDRESS@:5061;transport=tls!g"

debug=1
log_stderror=yes
log_prefix="sippycup-proxy: "
memdbg=5
memlog=5
children=2
tcp_children=2
auto_aliases=no
dns=no
rev_dns=no
use_dns_cache=off
dns_try_ipv6=no
server_header="Server: Sippycup practice proxy (Kamailio)"
user_agent_header="User-Agent: Sippycup practice proxy (Kamailio)"
server_signature=no
sip_warning=0

listen=udp:@PROXY_ADDRESS@:5060
listen=tcp:@PROXY_ADDRESS@:5060
listen=tls:@PROXY_ADDRESS@:5061
alias="@PROXY_ADDRESS@"
alias="@PROXY_DNS_NAME@"

enable_tls=yes
# Outbound TCP/TLS connections (the trunk to Asterisk) start from the proxy
# address, which Asterisk's endpoint ACL requires.
tcp_source_ipv4=@PROXY_ADDRESS@
tcp_connection_lifetime=3605
tcp_accept_no_cl=yes

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "xlog.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "pike.so"
loadmodule "tls.so"
loadmodule "corex.so"

modparam("tm", "fr_timer", 10000)
modparam("tm", "fr_inv_timer", 120000)
# Double Record-Route when the transport changes (UDP or TCP outside, TLS to
# Asterisk) and keep from-tag based direction detection.
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "default_expires", 120)
modparam("registrar", "min_expires", 30)
modparam("registrar", "max_expires", 300)
modparam("registrar", "max_contacts", 1)
modparam("auth", "qop", "auth")
modparam("auth", "nonce_expire", 300)
# Generous: the practice campaigns send a handful of requests per second.
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 60)
modparam("pike", "remove_latency", 4)
modparam("tls", "config", "@RUNTIME@/etc/kamailio/tls.cfg")

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "malformed request from $si:$sp\n");
        exit;
    }
    # Nobody but this proxy may assert the trunk identity towards Asterisk.
    remove_hf("X-Sippycup-Trunk");

    if (src_ip != myself && !has_totag() && !pike_check_req()) {
        xlog("L_WARN", "rate limit: $rm from $si\n");
        append_to_reply("Retry-After: 5\r\n");
        sl_send_reply("503", "Rate Limited");
        exit;
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }
    if (is_method("ACK")) {
        # An ACK for a negative final response is absorbed by its
        # transaction; a stray one is dropped.
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }
    t_check_trans();

    if (is_method("OPTIONS")) {
        append_to_reply("Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, REGISTER, UPDATE, INFO\r\n");
        append_to_reply("Accept: application/sdp\r\n");
        sl_send_reply("200", "OK");
        exit;
    }
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }
    if (is_method("INVITE")) {
        route(TO_ASTERISK);
        exit;
    }
    sl_send_reply("405", "Method Not Allowed");
    exit;
}

route[WITHINDLG] {
    if (loose_route()) {
        if (is_method("BYE|ACK|INVITE|UPDATE|INFO|PRACK|CANCEL")) {
            route(RELAY);
            exit;
        }
        sl_send_reply("403", "Forbidden In Dialog");
        exit;
    }
    if (is_method("ACK")) {
        # ACK of a negative final response, hop by hop.
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }
    # Strict about the route set: an in-dialog request that does not carry
    # this proxy's Route (for example one sent straight to the remote target)
    # is refused.
    sl_send_reply("404", "Not Here: In-Dialog Request Without Route");
    exit;
}

route[REGISTRAR] {
    if ($au != "PRACTICE_ACCOUNT" || $tU != "PRACTICE_ACCOUNT") {
        auth_challenge("PROXY_REALM", "1");
        exit;
    }
    if (!pv_www_authenticate("PROXY_REALM", "PRACTICE_PASSWORD", "0")) {
        auth_challenge("PROXY_REALM", "1");
        exit;
    }
    consume_credentials();
    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

route[TO_ASTERISK] {
    if ($au != "PRACTICE_ACCOUNT") {
        auth_challenge("PROXY_REALM", "1");
        exit;
    }
    if (!pv_proxy_authenticate("PROXY_REALM", "PRACTICE_PASSWORD", "0")) {
        auth_challenge("PROXY_REALM", "1");
        exit;
    }
    consume_credentials();
    record_route();
    append_hf("X-Sippycup-Trunk: TRUNK_TOKEN\r\n");
    $du = "ASTERISK_HOP";
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
