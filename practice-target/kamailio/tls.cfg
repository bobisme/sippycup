# Sippycup practice proxy TLS profile (bn-2g0), rendered at container start.
# The certificate is signed by the same per-`up` practice CA as Asterisk's,
# under the distinct name @PROXY_DNS_NAME@ (DNS SAN) and IP SAN @PROXY_ADDRESS@.
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
certificate = @RUNTIME@/tls/proxy.crt
private_key = @RUNTIME@/tls/proxy.key

# Towards Asterisk (the trunk leg): verify its certificate against the
# per-`up` practice CA.
[client:default]
method = TLSv1.2+
verify_certificate = yes
require_certificate = yes
ca_list = @RUNTIME@/tls/ca.crt
