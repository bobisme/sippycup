# Template only. `./bin/sippycup practice-target up` renders it into
# work/practice/target-profile.yaml with a validity window that starts at `up`
# and lasts four hours. The placeholders below are not valid values, so this
# checked-in file can never pass `rehearse` and never carries a standing
# approval. It names only the loopback practice address, which exists solely
# inside the practice target's private network namespace.
schema_version: sippycup.dev/target-profile/v1
name: sippycup-local-practice
target:
  host: '@ADDRESS@'
  port: 5060
  transport: udp
  approved_addresses:
    - '@ADDRESS@'
  # Every practice destination (`practice-target info`), each numeric alias, and
  # `nobody-home`, which the dial plan does not have on purpose (the drill's 404
  # scenario). `call` and `matrix` refuse any other --dial with this profile.
  approved_destinations: [echo, tone, busy, decline, dtmf, noanswer, late, silent, silence, drop, unavailable, forbidden, ratelimit, earlymedia, '600', '601', '602', '486', '603', nobody-home]
authorization:
  status: approved
  approved_by: sippycup practice-target up (local loopback practice only)
  approval_id: '@APPROVAL_ID@'
  valid_from: '@VALID_FROM@'
  valid_until: '@VALID_UNTIL@'
limits:
  max_calls: 1
  max_concurrency: 1
  max_calls_per_second: 1
  max_duration_seconds: 60
capture:
  interface: lo
  output: work/practice/call.pcap
features:
  ice: false
  turn: false
  srtp: true
  dtls_srtp: false
  webrtc: false
