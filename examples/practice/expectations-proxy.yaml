# Packet-oracle expectations for one authenticated echo call through the
# practice proxy (bn-2g0). Signaling goes to '@PROXY_ADDRESS@'; the proxy
# forwards to and the media comes from '@ADDRESS@'.
schema_version: sippycup.expectations/v1
capture:
  allowed_endpoints:
    - '@CALLER_ADDRESS@'
    - '@PROXY_ADDRESS@'
    - '@ADDRESS@'
expectations:
  - id: practice-proxy-echo-call
    type: call_path
    on_unknown: inconclusive
    parameters:
      require_bidirectional: true
      expected_codecs:
        - PCMU
      require_dtmf: false
      allow_symmetric_rtp: true
      max_setup_ms: 5000
      max_loss_fraction: 0.01
      max_duplicates: 0
      max_reordered: 0
      max_jitter_ms: 30
      timestamp_jump_tolerance_ms: 200
