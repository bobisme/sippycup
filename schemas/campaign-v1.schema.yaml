$schema: https://json-schema.org/draft/2020-12/schema
$id: https://sippycup.dev/schemas/campaign-v1.schema.yaml
title: Sippycup campaign manifest v1
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, authorization, targets, cases, expectations, evidence]
properties:
  apiVersion:
    const: sippycup.dev/v1
  kind:
    const: Campaign
  metadata:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,62}$'
  authorization:
    type: object
    additionalProperties: false
    required:
      - networks
      - signalingPorts
      - mediaPorts
      - transports
      - ceilings
      - stopConditions
    properties:
      networks:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      mediaNetworks:
        description: >-
          Optional media-only networks (media servers behind a proxy or SBC).
          Media may flow to and from them within mediaPorts; a target may never
          resolve into them unless networks also contains it. At most 16
          networks and 1024 addresses together.
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string}
      mediaAllowed:
        description: >-
          Optional: the owner's media answer (scope media.networks), written by
          scope compile. When present, a call step admits media only inside
          these networks (single addresses as /32 or /128), not at its own
          signaling address unless one of them holds it. Each must lie inside
          networks or mediaNetworks; it only narrows.
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      approval:
        description: >-
          Optional approval window of the owner's written authorization.
          campaign plan refuses when validUntil has passed; campaign run sends
          nothing before validFrom or after validUntil and re-checks before
          every step. Timestamps are RFC 3339 with a timezone. A manifest
          without it is not bound to a window (campaign prints a warning).
        type: object
        additionalProperties: false
        required: [validUntil]
        properties:
          id: {type: string, minLength: 1, maxLength: 128}
          validFrom: {type: string}
          validUntil: {type: string}
      signalingPorts:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: integer, minimum: 1, maximum: 65535}
      mediaPorts:
        type: object
        additionalProperties: false
        required: [start, end]
        properties:
          start: {type: integer, minimum: 1, maximum: 65535}
          end: {type: integer, minimum: 1, maximum: 65535}
      transports:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [udp, tcp, tls]}
      credentialRefs:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
      ceilings:
        type: object
        additionalProperties: false
        required:
          - calls
          - packets
          - bytes
          - durationSeconds
          - concurrentCalls
          - packetsPerSecond
          - callsPerSecond
        properties:
          calls: {$ref: '#/$defs/positiveU64'}
          packets: {$ref: '#/$defs/positiveU64'}
          bytes: {$ref: '#/$defs/positiveU64'}
          durationSeconds: {$ref: '#/$defs/positiveU64'}
          concurrentCalls: {$ref: '#/$defs/positiveU64'}
          packetsPerSecond: {$ref: '#/$defs/positiveU64'}
          callsPerSecond: {$ref: '#/$defs/positiveU64'}
      stopConditions:
        type: object
        additionalProperties: false
        required: [consecutiveFailures, unexpectedResponse, packetLossPercent]
        properties:
          consecutiveFailures: {$ref: '#/$defs/positiveU64'}
          unexpectedResponse: {type: boolean}
          packetLossPercent: {type: number, minimum: 0, maximum: 100}
          preflightServerError: {type: boolean}
  targets:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, address, signaling]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        address: {type: string, minLength: 1}
        signaling:
          type: object
          additionalProperties: false
          required: [transport, port]
          properties:
            transport: {enum: [udp, tcp, tls]}
            port: {type: integer, minimum: 1, maximum: 65535}
        credentialRef:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        account:
          description: >-
            Account used by the softphone runner for digest challenges and
            optional registration. Requires credentialRef; the password is
            never part of the manifest.
          type: object
          additionalProperties: false
          required: [username]
          properties:
            username: {$ref: '#/$defs/sipUser'}
            realm:
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,252}$'
            register: {type: boolean, default: false}
        media:
          description: >-
            Media security of this target's softphone calls: SDES-SRTP off,
            optional (RTP/AVP with a=crypto), or mandatory (RTP/SAVP; a call
            that does not negotiate SRTP fails). SDES keys are confidential
            only over TLS signaling; over UDP/TCP the runner warns
            sdes-key-exposed-on-cleartext-signaling. Frozen into every call
            step of the target.
          type: object
          additionalProperties: false
          required: [srtp]
          properties:
            srtp: {enum: ['off', optional, mandatory]}
      dependentRequired:
        account: [credentialRef]
  cases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, type, target, count, budget]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        type: {enum: [options, call]}
        target:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        count: {$ref: '#/$defs/positiveU64'}
        budget:
          type: object
          additionalProperties: false
          required: [packetsPerRun, bytesPerRun, durationSecondsPerRun]
          properties:
            packetsPerRun: {$ref: '#/$defs/positiveU64'}
            bytesPerRun: {$ref: '#/$defs/positiveU64'}
            durationSecondsPerRun: {$ref: '#/$defs/positiveU64'}
        expectations:
          type: object
          additionalProperties: false
          required: [apiVersion]
          properties:
            apiVersion: {const: sippycup.dev/case-expectations/v1}
            finalStatus: {type: integer, minimum: 200, maximum: 699}
            allowedProvisionalStatuses:
              type: array
              uniqueItems: true
              items: {type: integer, minimum: 100, maximum: 199}
            requireBidirectionalRtp: {type: boolean}
            maxSetupSeconds: {$ref: '#/$defs/positiveU64'}
        generated:
          $ref: '#/$defs/generatedCase'
        dial:
          description: >-
            SIP user part a call case dials at the frozen target address
            (sip:USER@ADDRESS:PORT). Valid only for type call.
          type: object
          additionalProperties: false
          required: [user]
          properties:
            user: {$ref: '#/$defs/sipUser'}
        call:
          description: >-
            Reviewed in-call actions for the softphone runner. dtmf is 1-32
            RFC 4733 digits (0-9 A-D * #) with ',' as a 1 s pause, sent
            dtmfAfterSeconds (default 1) after answer; durationSeconds
            (default 5, clamped to the budget; not with generated) is how
            long the call stays connected, for example to hear an IVR
            respond. The runner never falls back to SIP INFO or in-band
            DTMF. codecs (not with generated) are the only codecs the call
            offers, in preference order, from the image's PJSUA set; names
            are case-insensitive and frozen in this spelling. At least one
            of dtmf and codecs is required. Valid only for type call.
          type: object
          additionalProperties: false
          anyOf:
            - required: [dtmf]
            - required: [codecs]
          properties:
            dtmf:
              type: string
              pattern: '^[0-9A-D*#,]{1,64}$'
            dtmfAfterSeconds: {type: integer, minimum: 0, maximum: 60}
            durationSeconds: {type: integer, minimum: 1, maximum: 3600}
            codecs:
              type: array
              minItems: 1
              maxItems: 9
              uniqueItems: true
              items:
                enum: [PCMU, PCMA, G722, GSM, iLBC, opus, speex/8000, speex/16000, speex/32000]
      allOf:
        - if:
            required: [dial]
          then:
            properties:
              type: {const: call}
        - if:
            required: [call]
          then:
            properties:
              type: {const: call}
  matrix:
    $ref: '#/$defs/matrix'
  expectations:
    type: object
    additionalProperties: false
    required: [allowedSipStatuses, requireBidirectionalRtp]
    properties:
      allowedSipStatuses:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: integer, minimum: 100, maximum: 699}
      requireBidirectionalRtp: {type: boolean}
  evidence:
    type: object
    additionalProperties: false
    required: [capture, retainPayload, directory]
    properties:
      capture: {type: boolean}
      retainPayload: {type: boolean}
      directory: {type: string, minLength: 1}
$defs:
  sipUser:
    type: string
    pattern: '^[A-Za-z0-9+*][A-Za-z0-9._+*-]{0,63}$'
  positiveU64:
    type: integer
    minimum: 1
    maximum: 18446744073709551615
  matrix:
    type: object
    additionalProperties: false
    required: [factors, constraints, mandatoryCases, riskWeights]
    properties:
      factors:
        type: object
        additionalProperties: false
        required:
          - transport
          - addressFamily
          - codec
          - ptime
          - mediaProtection
          - dtmf
          - earlyMedia
          - holdReinvite
          - teardownInitiator
          - duration
          - nat
          - impairment
        properties:
          transport: {$ref: '#/$defs/transportDomain'}
          addressFamily: {$ref: '#/$defs/addressFamilyDomain'}
          codec: {$ref: '#/$defs/codecDomain'}
          ptime: {$ref: '#/$defs/ptimeDomain'}
          mediaProtection: {$ref: '#/$defs/mediaProtectionDomain'}
          dtmf: {$ref: '#/$defs/dtmfDomain'}
          earlyMedia: {$ref: '#/$defs/earlyMediaDomain'}
          holdReinvite: {$ref: '#/$defs/holdReinviteDomain'}
          teardownInitiator: {$ref: '#/$defs/teardownInitiatorDomain'}
          duration: {$ref: '#/$defs/durationDomain'}
          nat: {$ref: '#/$defs/natDomain'}
          impairment: {$ref: '#/$defs/impairmentDomain'}
      constraints:
        type: array
        items: {$ref: '#/$defs/matrixConstraint'}
      mandatoryCases:
        type: array
        items: {$ref: '#/$defs/mandatoryCase'}
      interactionStrength:
        type: integer
        minimum: 1
        maximum: 12
      riskWeights:
        type: array
        items: {$ref: '#/$defs/riskWeight'}
  finiteDomain:
    type: array
    minItems: 1
    maxItems: 32
    uniqueItems: true
  transportDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [udp, tcp, tls]}
  addressFamilyDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [ipv4, ipv6]}
  codecDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [pcmu, pcma, g722, opus]}
  ptimeDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [10, 20, 30, 40, 60]}
  mediaProtectionDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [plain, sdes-srtp, dtls-srtp]}
  dtmfDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [rfc4733, sip-info, inband, none]}
  earlyMediaDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [disabled, 183-sdp, reliable]}
  holdReinviteDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [disabled, sendonly, inactive]}
  teardownInitiatorDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [caller, callee, timeout]}
  durationDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {type: integer, minimum: 1, maximum: 3600}
  natDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [none, endpoint-nat, symmetric-nat]}
  impairmentDomain:
    allOf:
      - {$ref: '#/$defs/finiteDomain'}
      - items: {enum: [none, loss, jitter, latency, reorder, duplicate]}
  matrixPredicate:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      transport: {$ref: '#/$defs/transportSelection'}
      addressFamily: {$ref: '#/$defs/addressFamilySelection'}
      codec: {$ref: '#/$defs/codecSelection'}
      ptime: {$ref: '#/$defs/ptimeSelection'}
      mediaProtection: {$ref: '#/$defs/mediaProtectionSelection'}
      dtmf: {$ref: '#/$defs/dtmfSelection'}
      earlyMedia: {$ref: '#/$defs/earlyMediaSelection'}
      holdReinvite: {$ref: '#/$defs/holdReinviteSelection'}
      teardownInitiator: {$ref: '#/$defs/teardownInitiatorSelection'}
      duration: {$ref: '#/$defs/durationSelection'}
      nat: {$ref: '#/$defs/natSelection'}
      impairment: {$ref: '#/$defs/impairmentSelection'}
  transportSelection:
    oneOf:
      - {enum: [udp, tcp, tls]}
      - {$ref: '#/$defs/transportDomain'}
  addressFamilySelection:
    oneOf:
      - {enum: [ipv4, ipv6]}
      - {$ref: '#/$defs/addressFamilyDomain'}
  codecSelection:
    oneOf:
      - {enum: [pcmu, pcma, g722, opus]}
      - {$ref: '#/$defs/codecDomain'}
  ptimeSelection:
    oneOf:
      - {enum: [10, 20, 30, 40, 60]}
      - {$ref: '#/$defs/ptimeDomain'}
  mediaProtectionSelection:
    oneOf:
      - {enum: [plain, sdes-srtp, dtls-srtp]}
      - {$ref: '#/$defs/mediaProtectionDomain'}
  dtmfSelection:
    oneOf:
      - {enum: [rfc4733, sip-info, inband, none]}
      - {$ref: '#/$defs/dtmfDomain'}
  earlyMediaSelection:
    oneOf:
      - {enum: [disabled, 183-sdp, reliable]}
      - {$ref: '#/$defs/earlyMediaDomain'}
  holdReinviteSelection:
    oneOf:
      - {enum: [disabled, sendonly, inactive]}
      - {$ref: '#/$defs/holdReinviteDomain'}
  teardownInitiatorSelection:
    oneOf:
      - {enum: [caller, callee, timeout]}
      - {$ref: '#/$defs/teardownInitiatorDomain'}
  durationSelection:
    oneOf:
      - {type: integer, minimum: 1, maximum: 3600}
      - {$ref: '#/$defs/durationDomain'}
  natSelection:
    oneOf:
      - {enum: [none, endpoint-nat, symmetric-nat]}
      - {$ref: '#/$defs/natDomain'}
  impairmentSelection:
    oneOf:
      - {enum: [none, loss, jitter, latency, reorder, duplicate]}
      - {$ref: '#/$defs/impairmentDomain'}
  matrixConstraint:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,62}$'
      require: {$ref: '#/$defs/matrixPredicate'}
      exclude: {$ref: '#/$defs/matrixPredicate'}
      if: {$ref: '#/$defs/matrixPredicate'}
      then: {$ref: '#/$defs/matrixPredicate'}
      rationale: {type: string, minLength: 1}
    oneOf:
      - required: [require]
      - required: [exclude]
      - required: [if, then]
  completeAssignment:
    type: object
    additionalProperties: false
    required:
      - transport
      - addressFamily
      - codec
      - ptime
      - mediaProtection
      - dtmf
      - earlyMedia
      - holdReinvite
      - teardownInitiator
      - duration
      - nat
      - impairment
    properties:
      transport: {enum: [udp, tcp, tls]}
      addressFamily: {enum: [ipv4, ipv6]}
      codec: {enum: [pcmu, pcma, g722, opus]}
      ptime: {enum: [10, 20, 30, 40, 60]}
      mediaProtection: {enum: [plain, sdes-srtp, dtls-srtp]}
      dtmf: {enum: [rfc4733, sip-info, inband, none]}
      earlyMedia: {enum: [disabled, 183-sdp, reliable]}
      holdReinvite: {enum: [disabled, sendonly, inactive]}
      teardownInitiator: {enum: [caller, callee, timeout]}
      duration: {type: integer, minimum: 1, maximum: 3600}
      nat: {enum: [none, endpoint-nat, symmetric-nat]}
      impairment: {enum: [none, loss, jitter, latency, reorder, duplicate]}
  mandatoryCase:
    type: object
    additionalProperties: false
    required: [id, values]
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,62}$'
      values: {$ref: '#/$defs/completeAssignment'}
      rationale: {type: string, minLength: 1}
  riskWeight:
    type: object
    additionalProperties: false
    required: [id, when, weight, rationale]
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,62}$'
      when: {$ref: '#/$defs/matrixPredicate'}
      weight: {$ref: '#/$defs/positiveU64'}
      rationale: {type: string, minLength: 1}
      coveringFactors:
        type: array
        minItems: 1
        maxItems: 12
        uniqueItems: true
        items:
          enum:
            - transport
            - addressFamily
            - codec
            - ptime
            - mediaProtection
            - dtmf
            - earlyMedia
            - holdReinvite
            - teardownInitiator
            - duration
            - nat
            - impairment
      interactionStrength:
        type: integer
        minimum: 2
        maximum: 12
    dependentRequired:
      coveringFactors: [interactionStrength]
      interactionStrength: [coveringFactors]
  generatedCase:
    type: object
    additionalProperties: false
    required: [row, sequence, factors, actions]
    properties:
      row: {$ref: '#/$defs/positiveU64'}
      sequence: {$ref: '#/$defs/positiveU64'}
      factors: {$ref: '#/$defs/completeAssignment'}
      actions:
        type: array
        minItems: 1
        items:
          enum: [dtmf, hold, resume, reinvite, failure, recover, hangup]
